apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DJANGO_DEBUG: "False"
  USE_DOCKER: "yes"
  DJANGO_ADMIN_URL: "admin/"
  DJANGO_SETTINGS_MODULE: "config.settings.local"
  DJANGO_SECRET_KEY: "CHANGEME"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,.wagtailspace02.scaf.sixfeetup.com"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost,https://wagtailspace02.scaf.sixfeetup.com"
  DJANGO_SECURE_SSL_REDIRECT: "False"
  PGDATA: "/var/lib/postgresql/data/pgdata"
  POSTGRES_DB: "wagtailspace02"
  POSTGRES_USER: "wagtailspace02"
  REDIS_URL: "redis://redis:6379/1"

  CMS_PUBLIC_BASE_URL: "http://localhost:8000"
  CMS_BACKEND_BASE_URL: "http://localhost:8000"


  # S3 storage access
  DJANGO_AWS_REGION_NAME: "us-east-1"

